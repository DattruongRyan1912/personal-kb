[project]
name = "personal-kb"
version = "0.1.0"
description = "Personal Knowledge Base (Personal-KB) AI core: memory fabric, agent orchestration and SDD specs"
requires-python = ">=3.11,<3.12"
dependencies = [
    "asyncpg>=0.32.0",
    "fastapi>=0.142.2",
    "httpx>=0.28.1",
    "langchain>=1,<2",
    "langchain-core>=1.6.7",
    "langchain-openai>=1.6.7",
    "langchain-text-splitters>=1.1.3",
    "langfuse>=4.17.0",
    "langgraph>=1.2.14",
    "mcp>=2.3.0",
    "openai>=3.26.0",
    "pgvector>=0.5.1",
    "pydantic-settings>=2.15.0",
    "pyjwt[crypto]>=2.15.1",
    "pyyaml>=6.0.3",
    "redis>=5",
    "tenacity>=9.2.1",
    "tiktoken>=0.14.0",
    "tree-sitter>=0.23.0",
    "tree-sitter-language-pack>=0.3.0",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv]
# ragas (eval group) needs instructor, which caps jiter below what openai 3.26 needs; jiter's API (from_json) is the
# same across these versions, so the cap is lifted rather than pinning openai back for an evaluation tool (4.2)
override-dependencies = ["jiter>=0.16"]
package = false

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# T20: no print() left from debugging (issue 4.1); the scripts are command-line tools that print their output
select = ["E", "F", "I", "B", "UP", "ASYNC", "T20"]

[tool.ruff.lint.per-file-ignores]
"scripts/**" = ["T20"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI declares parameters through these calls in defaults
extend-immutable-calls = ["fastapi.Depends", "fastapi.File", "fastapi.Form", "fastapi.Query"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[dependency-groups]
dev = [
    "fakeredis>=2.39.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.10",
]
eval = [
    "langchain-community==0.4.1",
    "ragas>=0.4,<0.5",
]
local-reranker = [
    "flagembedding>=1.4.2",
]
